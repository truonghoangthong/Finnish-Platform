<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test New Lesson API</title>
  <style>
    .form-group { margin: 10px 0; }
    button { margin-top: 10px; }
    #result { margin-top: 20px; color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>Add New Lesson</h2>
  <div class="form-group">
    <label for="lessonName">Lesson Name:</label>
    <input type="text" id="lessonName" required>
  </div>
  <div class="form-group">
    <label for="description">Description:</label>
    <textarea id="description" required></textarea>
  </div>
  <div class="form-group">
    <label for="creator">Creator:</label>
    <input type="text" id="creator" required>
  </div>
  <div class="form-group">
    <label for="level">Level:</label>
    <input type="text" id="level" required>
  </div>
  <div class="form-group">
    <label for="challenge">Challenge:</label>
    <input type="text" id="challenge" required>
  </div>
  <button onclick="submitForm()">Submit</button>
  <div id="result"></div>

  <script>
    async function submitForm() {
      const lessonName = document.getElementById('lessonName').value;
      const description = document.getElementById('description').value;
      const creator = document.getElementById('creator').value;
      const level = document.getElementById('level').value;
      const challenge = document.getElementById('challenge').value;
      const resultDiv = document.getElementById('result');

      if (!lessonName || !description || !creator || !level || !challenge) {
        resultDiv.innerHTML = '<p class="error">All fields are required nè mầy!</p>';
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/new_lesson', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ lessonName, description, creator, level, challenge }),
        });

        const data = await response.json();
        if (response.ok) {
          resultDiv.innerHTML = `<p>${data.Title}: ${data.Message} (ID: ${data.userId})</p>`;
        } else {
          resultDiv.innerHTML = `<p class="error">${data.Title}: ${data.Message}</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">Lỗi server nè mầy: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
