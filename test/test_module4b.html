<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finnish Translation Evaluator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 40px;
      max-width: 700px;
      width: 100%;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h2 {
      color: #2c3e50;
      font-size: 2.2rem;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .header p {
      color: #7f8c8d;
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #2c3e50;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 15px;
      border: 2px solid #ecf0f1;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      transition: all 0.3s ease;
      background: #fafbfc;
    }

    textarea:focus {
      outline: none;
      border-color: #3498db;
      background: white;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    textarea::placeholder {
      color: #95a5a6;
      font-style: italic;
    }

    .submit-btn {
      width: 100%;
      padding: 15px 30px;
      background: linear-gradient(45deg, #3498db, #2980b9);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
    }

    .submit-btn:hover {
      background: linear-gradient(45deg, #2980b9, #21618c);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #result {
      margin-top: 30px;
      padding: 25px;
      border-radius: 15px;
      min-height: 60px;
      transition: all 0.3s ease;
    }

    .result-loading {
      background: linear-gradient(45deg, #f39c12, #e67e22);
      color: white;
      text-align: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
    }

    .result-success {
      background: #f8f9fa;
      border: 2px solid #27ae60;
      color: #2c3e50;
    }

    .result-error {
      background: #fdf2f2;
      border: 2px solid #e74c3c;
      color: #c0392b;
      font-weight: 500;
    }

    .evaluation-display {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .evaluation-display h3 {
      color: #2980b9;
      margin-bottom: 15px;
      font-size: 1.3rem;
    }

    .evaluation-content {
      line-height: 1.6;
      color: #2c3e50;
    }

    .evaluation-content strong {
      color: #2c3e50;
    }

    .evaluation-content em {
      background: #ecf0f1;
      padding: 2px 6px;
      border-radius: 4px;
      font-style: normal;
    }

    .input-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 25px;
        margin: 10px;
      }
      
      .header h2 {
        font-size: 1.8rem;
      }
      
      .input-pair {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🇫🇮 Finnish Translation Evaluator</h2>
      <p>Test your Finnish translation skills with AI-powered feedback!</p>
    </div>

    <form id="evalForm">
      <div class="input-pair">
        <div class="form-group">
          <label for="finnish">Finnish Sentence 🇫🇮</label>
          <textarea 
            id="finnish" 
            name="finnishSentence" 
            required 
            placeholder="Enter your Finnish sentence here..."
          ></textarea>
        </div>

        <div class="form-group">
          <label for="translation">Your English Translation 🌍</label>
          <textarea 
            id="translation" 
            name="userTranslation" 
            required 
            placeholder="Enter your English translation here..."
          ></textarea>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span id="btnText">🚀 Evaluate Translation</span>
      </button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    function parseMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/###\s*(.*?)$/gm, '<h3>$1</h3>')
        .replace(/^\d+\.\s*(.*?)$/gm, '<li>$1</li>')
        .replace(/^-\s*(.*?)$/gm, '<li>$1</li>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }

    function displayEvaluation(data) {
      const resultDiv = document.getElementById('result');
      
      if (data.evaluation) {
        resultDiv.className = 'result-success';
        resultDiv.innerHTML = `
          <div class="evaluation-display">
            <h3>📊 AI Evaluation Results</h3>
            <div class="evaluation-content">
              ${parseMarkdown(data.evaluation)}
            </div>
          </div>
        `;
      } else if (data.feedback) {
        resultDiv.className = 'result-success';
        resultDiv.innerHTML = `
          <div class="evaluation-display">
            <h3>📊 Translation Feedback</h3>
            <div class="evaluation-content">
              ${parseMarkdown(data.feedback)}
            </div>
          </div>
        `;
      } else {
        resultDiv.className = 'result-success';
        resultDiv.innerHTML = `
          <div class="evaluation-display">
            <h3>📊 Server Response</h3>
            <pre style="background: #f8f9fa; padding: 15px; border-radius: 8px; overflow-x: auto;">${JSON.stringify(data, null, 2)}</pre>
          </div>
        `;
      }
    }

    document.getElementById('evalForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const finnishSentence = document.getElementById('finnish').value;
      const userTranslation = document.getElementById('translation').value;
      const resultDiv = document.getElementById('result');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');

      // Show loading state
      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="loading-spinner"></span>Analyzing translation...';
      resultDiv.className = 'result-loading';
      resultDiv.innerHTML = '🔍 AI is evaluating your translation... Please wait!';

      try {
        const response = await fetch('http://localhost:3000/api/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ finnishSentence, userTranslation })
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status} ${response.statusText}`);
        }

        const text = await response.text();
        console.log('Raw response:', text);
        
        let data = {};
        if (text.trim()) {
          try {
            data = JSON.parse(text);
          } catch (parseError) {
            data = { evaluation: text };
          }
        } else {
          data = { evaluation: 'No response received from the server.' };
        }

        displayEvaluation(data);

      } catch (error) {
        resultDiv.className = 'result-error';
        resultDiv.innerHTML = `
          <h3>❌ Error Occurred</h3>
          <p><strong>Error:</strong> ${error.message}</p>
          <p>Please check your connection and try again.</p>
        `;
        console.error('Request error:', error);
      } finally {
        // Reset button state
        submitBtn.disabled = false;
        btnText.innerHTML = '🚀 Evaluate Translation';
      }
    });

    // Add some sample data for testing
    document.addEventListener('DOMContentLoaded', () => {
      const sampleButton = document.createElement('button');
      sampleButton.type = 'button';
      sampleButton.textContent = '🎯 Fill Sample Data';
      sampleButton.style.cssText = `
        margin-bottom: 20px;
        padding: 8px 16px;
        background: #95a5a6;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
      `;
      
      sampleButton.addEventListener('click', () => {
        document.getElementById('finnish').value = 'Minä syön herkullista ruokaa illalla';
        document.getElementById('translation').value = 'I eat delicious food in the evening';
      });
      
      document.querySelector('form').insertBefore(sampleButton, document.querySelector('.input-pair'));
    });
  </script>
</body>
</html>
